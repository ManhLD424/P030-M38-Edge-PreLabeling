# Default Configuration for P030-M38 Model Compression & Inference

model:
  raw_weights: "models/raw/yolov8s.pt"
  onnx_path: "models/onnx/yolov8s.onnx"
  openvino_fp16_dir: "models/openvino_fp16"
  openvino_int8_dir: "models/openvino_int8"
  input_shape: [1, 3, 640, 640]
  device: "CPU"

compression:
  nncf_preset: "PERFORMANCE"     # INT8 symmetric weights, asymmetric activations
  subset_size: 200               # Số lượng ảnh calibration tĩnh
  calib_dir: "data/calibration"
  model_type: "OBJECT_DETECTION"

inference:
  conf_threshold: 0.35
  iou_threshold: 0.45
  num_threads: 4                 # Tối ưu hóa số luồng CPU
  performance_mode: "LATENCY"    # LATENCY hoặc THROUGHPUT

classes:
  0: "person"
  1: "bicycle"
  2: "car"
  3: "motorcycle"
  5: "bus"
  7: "truck"
  9: "traffic light"
  11: "stop sign"
